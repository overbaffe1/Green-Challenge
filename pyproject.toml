[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greenchallenge"
version = "0.1.0"
description = "Execution layer and evaluation tooling for the Green Challenge 2026 VLA benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "msgpack>=1.0",
    "websockets>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
greenchallenge-serve = "greenchallenge.entrypoint:main"

[tool.setuptools]
packages = ["greenchallenge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
