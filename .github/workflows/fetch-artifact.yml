# Fetch a large artefact from an external bucket and store it in Git, in
# ~90 MB chunks, without Git LFS.
#
# Why a workflow: the artefact lives behind a presigned Sber OBS URL that a
# local machine may not be able to reach, while a GitHub-hosted runner can.
# The URL is a credential: it is read from the SUBMISSION_URL secret and is
# never written into the repository or printed un-masked.
#
# Outputs:
#   * branch  artifacts/submission-zip   chunk files + MANIFEST.txt + SHA256SUMS
#   * release submission-<timestamp>     the same chunks as release assets
#   * artefact `submission-parts`        same chunks, 7-day retention
#
# The chunk branch is rewritten from scratch on every run (orphan commit,
# force-push), so repeated runs do not grow the repository history.

name: fetch-artifact

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Presigned URL override (leave empty to use the SUBMISSION_URL secret)"
        required: false
        default: ""
      chunk_mb:
        description: "Chunk size in MB; must stay below GitHub's 100 MB per-file limit"
        required: false
        default: "90"
      branch:
        description: "Branch that receives the chunks"
        required: false
        default: "artifacts/submission-zip"
      max_gb:
        description: "Refuse to download anything larger than this"
        required: false
        default: "8"
  push:
    branches:
      - arena/95a163d7-green-challenge
    paths:
      - ".github/workflows/fetch-artifact.yml"
      - "submission.url"

concurrency:
  group: fetch-artifact
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Resolve URL and guard rails
        id: cfg
        env:
          SECRET_URL: ${{ secrets.SUBMISSION_URL }}
          INPUT_URL: ${{ github.event.inputs.url }}
          INPUT_CHUNK_MB: ${{ github.event.inputs.chunk_mb }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          INPUT_MAX_GB: ${{ github.event.inputs.max_gb }}
        run: |
          set -euo pipefail
          URL="${INPUT_URL:-${SECRET_URL:-}}"
          # Last resort: a file at the repo root. It is git-ignored so it is
          # never committed by accident; the intended paths are the secret or
          # the workflow_dispatch input.
          if [ -z "$URL" ] && [ -f submission.url ]; then
            URL="$(tr -d '\r\n' < submission.url)"
            echo "::warning::URL taken from submission.url; delete it and use the secret"
          fi
          if [ -z "$URL" ]; then
            echo "have_url=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no URL configured (secret, input or submission.url); nothing to fetch"
            exit 0
          fi
          echo "have_url=true" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

          CHUNK_MB="${INPUT_CHUNK_MB:-90}"
          if [ "$CHUNK_MB" -lt 1 ] || [ "$CHUNK_MB" -ge 100 ]; then
            echo "::error::chunk_mb must be 1..99 (GitHub rejects files over 100 MB)"
            exit 1
          fi
          echo "chunk_mb=$CHUNK_MB" >> "$GITHUB_OUTPUT"
          echo "branch=${INPUT_BRANCH:-artifacts/submission-zip}" >> "$GITHUB_OUTPUT"
          echo "max_gb=${INPUT_MAX_GB:-8}" >> "$GITHUB_OUTPUT"
          echo "Preparing download of ${#URL} characters from the presigned URL"

      - name: Probe reachability
        if: steps.cfg.outputs.have_url == 'true'
        id: probe
        env:
          URL: ${{ steps.cfg.outputs.url }}
        run: |
          set -euo pipefail
          # A HEAD request fails signature validation on many presigned GET
          # URLs, so ask for a single byte and read the size off Content-Range.
          CODE=$(curl -sS -o /dev/null -D headers.txt -w '%{http_code}' \
                   --max-time 30 -r 0-0 "$URL" || true)
          echo "range request status: $CODE"
          grep -i '^content-range:' headers.txt || true
          SIZE=$(grep -i '^content-range:' headers.txt | tail -1 | tr -d '\r' | sed 's#.*/##')
          echo "size_bytes=${SIZE:-0}" >> "$GITHUB_OUTPUT"
          if [ "$CODE" != "206" ] && [ "$CODE" != "200" ]; then
            echo "::error::the presigned URL answered $CODE; it is expired or the signature is wrong"
            exit 1
          fi
          if [ -n "${SIZE:-}" ] && [ "$SIZE" != "0" ]; then
            echo "object size: $(numfmt --to=iec "$SIZE")"
          fi

      - name: Download
        if: steps.cfg.outputs.have_url == 'true'
        env:
          URL: ${{ steps.cfg.outputs.url }}
          MAX_GB: ${{ steps.cfg.outputs.max_gb }}
        run: |
          set -euo pipefail
          MAX=$(( ${MAX_GB:-8} * 1000000000 ))
          # Resume + retries: a 3 GB transfer over a flaky link should not
          # start over. --fail makes an expired signature an error, not an
          # HTML error page saved as the artefact.
          curl -L --fail --retry 8 --retry-delay 5 --retry-all-errors \
               --continue-at - --connect-timeout 30 --max-filesize "$MAX" \
               -o submission.zip "$URL" --progress-bar
          ls -l submission.zip
          echo "size: $(stat -c%s submission.zip) bytes"
          file submission.zip
          # An expired presigned URL returns XML, which curl happily saves.
          if ! unzip -l submission.zip > listing.txt 2>/dev/null; then
            echo "::error::downloaded file is not a valid zip; first bytes:"
            head -c 300 submission.zip
            exit 1
          fi
          head -n 60 listing.txt
          echo "entries: $(tail -n +4 listing.txt | wc -l)"

      - name: Checksum and split
        if: steps.cfg.outputs.have_url == 'true'
        env:
          CHUNK_MB: ${{ steps.cfg.outputs.chunk_mb }}
        run: |
          set -euo pipefail
          SHA=$(sha256sum submission.zip | awk '{print $1}')
          SIZE=$(stat -c%s submission.zip)
          echo "sha256=$SHA" >> "$GITHUB_ENV"
          echo "size_bytes=$SIZE" >> "$GITHUB_ENV"
          split -b "${CHUNK_MB}M" -d -a 3 submission.zip submission.zip.part.
          ls -l submission.zip.part.* | sed -n '1,5p'
          echo "parts: $(ls submission.zip.part.* | wc -l)"
          {
            echo "artifact: submission.zip"
            echo "size_bytes: $SIZE"
            echo "sha256: $SHA"
            echo "chunk_mb: $CHUNK_MB"
            echo "parts: $(ls submission.zip.part.* | wc -l)"
            echo "source: presigned URL, fetched $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "reassemble: cat submission.zip.part.* > submission.zip"
            echo "verify: sha256sum -c SHA256SUMS"
          } > MANIFEST.txt
          cat MANIFEST.txt
          sha256sum submission.zip.part.* > SHA256SUMS.parts
          echo "$SHA  submission.zip" > SHA256SUMS
          rm submission.zip

      - name: Commit chunks to the artefacts branch
        if: steps.cfg.outputs.have_url == 'true'
        env:
          BRANCH: ${{ steps.cfg.outputs.branch }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/chunks
          cd /tmp/chunks
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -q -b "$BRANCH"
          cp "$GITHUB_WORKSPACE/MANIFEST.txt" .
          cp "$GITHUB_WORKSPACE/SHA256SUMS.parts" .
          cp "$GITHUB_WORKSPACE/SHA256SUMS" .
          # Batch the chunks: one push per 4 parts keeps each pack well under
          # GitHub's push limit while avoiding ~40 round trips.
          n=0
          for part in "$GITHUB_WORKSPACE"/submission.zip.part.*; do
            cp "$part" .
            n=$((n + 1))
            if [ $((n % 4)) -eq 0 ]; then
              git add -A
              git commit -q -m "chunks up to part $n"
              git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
              echo "pushed $n parts"
            fi
          done
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "final chunks"
            git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          fi
          git log --oneline -3
          echo "branch $BRANCH now has $(ls submission.zip.part.* | wc -l) parts"

      - name: Publish release as a backup
        if: steps.cfg.outputs.have_url == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="submission-$(date -u +%Y%m%d-%H%M)-${GITHUB_RUN_NUMBER}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "submission.zip $TAG" \
            --notes "sha256 \`${{ env.sha256 }}\`, ${{ env.size_bytes }} bytes, fetched from the presigned URL on $(date -u +%Y-%m-%dT%H:%MZ)." \
            MANIFEST.txt SHA256SUMS SHA256SUMS.parts submission.zip.part.* \
            || { echo "::warning::release upload failed; the chunks are on the branch"; exit 0; }
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[] | "\(.name)\t\(.size)"'

      - name: Upload chunks as a workflow artefact
        if: steps.cfg.outputs.have_url == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: submission-parts
          path: |
            MANIFEST.txt
            SHA256SUMS
            SHA256SUMS.parts
            submission.zip.part.*
          retention-days: 7
          if-no-files-found: error

      - name: Summary
        if: steps.cfg.outputs.have_url == 'true'
        run: |
          {
            echo "## fetch-artifact"
            echo
            echo "- size: ${{ env.size_bytes }} bytes"
            echo "- sha256: \`${{ env.sha256 }}\`"
            echo "- parts: $(ls submission.zip.part.* | wc -l)"
            echo "- branch: \`${BRANCH}\`"
            echo "- release: \`${TAG}\`"
            echo
            echo "Reassemble: \`cat submission.zip.part.* > submission.zip\`"
            echo
            echo '```'
            head -n 40 listing.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
